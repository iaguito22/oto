name: Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Tests de core, escritorio y Android
        run: ./gradlew :core:test :desktopApp:test :app:testDebugUnitTest --continue
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: "**/build/reports/tests/"
          retention-days: 7
