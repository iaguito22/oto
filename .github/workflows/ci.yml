name: Tests
on:
  push:
    branches: [main]
  pull_request:
  # Para lanzarla a mano en una rama sin PR.
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar FFmpeg
        # Evita apt y sus espejos: usa el del runner o el mismo respaldo estático de antes.
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
            ffprobe -version
          else
            curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o "$RUNNER_TEMP/ffmpeg.tar.xz"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            "$RUNNER_TEMP/ffmpeg/ffmpeg" -version
            "$RUNNER_TEMP/ffmpeg/ffprobe" -version
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          fi
      - name: Tests de core, escritorio y Android
        run: ./gradlew :core:test :desktopApp:test :app:testDebugUnitTest --continue
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: "**/build/reports/tests/"
          retention-days: 7
